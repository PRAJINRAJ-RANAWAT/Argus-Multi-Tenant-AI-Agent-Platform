# Scrapes every Argus service. Used by docker-compose.observability.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: argus-api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: argus-ingest
    static_configs: [{ targets: ["ingest:8000"] }]
  - job_name: argus-worker
    static_configs: [{ targets: ["worker:9100"] }]
  - job_name: argus-relay
    static_configs: [{ targets: ["relay:9101"] }]
