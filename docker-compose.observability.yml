# Observability stack for local runs and the VPS:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Grafana http://localhost:3000 (dashboard "Argus overview"), Prometheus :9090,
# Jaeger UI :16686 (traces arrive over OTLP/HTTP on :4318).
x-otel: &otel
  ARGUS_OTEL_ENDPOINT: http://jaeger:4318

services:
  api:
    environment: *otel
  ingest:
    environment: *otel
  relay:
    environment: *otel
  worker:
    environment: *otel

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]
