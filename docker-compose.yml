# Local development stack: Postgres + pgvector, Redis, and the Argus services.
name: argus

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: argus:dev
  environment:
    ARGUS_ENV: dev
    ARGUS_DATABASE_URL: postgresql://argus:argus@postgres:5432/argus
    ARGUS_REDIS_URL: redis://redis:6379/0
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["argus-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      ARGUS_ENV: dev
      ARGUS_SERVICE_NAME: argus-api
      ARGUS_DATABASE_URL: postgresql://argus:argus@postgres:5432/argus
      ARGUS_REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "argus.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]

  ingest:
    <<: *app
    environment:
      ARGUS_ENV: dev
      ARGUS_SERVICE_NAME: argus-ingest
      ARGUS_DATABASE_URL: postgresql://argus:argus@postgres:5432/argus
      ARGUS_REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "argus.ingest.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8001:8000"]

  worker:
    <<: *app
    command: ["argus-worker"]

volumes:
  pgdata:
  redisdata:
