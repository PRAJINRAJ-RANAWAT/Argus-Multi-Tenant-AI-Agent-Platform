    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Argus",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "__PUBLIC_URL__/",
        "description": "AI code review and codebase Q&A for engineering teams, built to run at scale.",
        "author": { "@type": "Person", "name": "Prajinraj Ranawat" }
      }
    </script>
    <script>
      // The landing page is dark-first; a saved choice from the app wins. Applied before
      // first paint so the theme never flashes.
      ;(function () {
        var t = "dark"
        try { t = localStorage.getItem("argus-theme") || "dark" } catch (e) {}
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown to crawlers and before the script runs; replaced on render. -->
      <main style="max-width: 720px; margin: 15vh auto; padding: 0 20px; font-family: system-ui, sans-serif">
        <h1>AI code review and codebase Q&amp;A for engineering teams, built to run at scale.</h1>
        <p>
          Argus reviews every pull request and answers questions about your code with citations, and keeps
          doing it through crashes, traffic floods and prompt injections.
        </p>
        <p><a href="/demo">Try the live demo</a></p>
      </main>
    </div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
