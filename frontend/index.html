<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Argus: multi-tenant AI agents for code review and codebase Q&A." />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <title>Argus</title>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      ;(function () {
        var t = "system"
        try { t = localStorage.getItem("argus-theme") || "system" } catch (e) {}
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
